plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
import java.util.Properties
import java.io.FileInputStream


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Function to read version from pubspec.yaml
def getPubspecVersion() {
    def pubspecFile = rootProject.file('../pubspec.yaml') // Path relative to android/app/build.gradle
    if (!pubspecFile.exists()) {
        throw new GradleException("File not found: ${pubspecFile.absolutePath}")
    }
    def pubspecContent = pubspecFile.text
    def versionLine = pubspecContent.split('\n').find { it.startsWith('version:') }
    if (versionLine == null) {
        throw new GradleException("version: line not found in pubspec.yaml")
    }
    def version = versionLine.split(':')[1].trim()
    return version
}

// Parse version name and code from pubspec.yaml
def version = getPubspecVersion()
def flutterVersionName = version.split('\\+')[0]
def flutterVersionCode = version.split('\\+').length > 1 ? version.split('\\+')[1] : '1' // Default versionCode to '1' if not present


android {
    compileSdkVersion 35
    namespace "org.fuks.app"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID
        // (https://developer.android.com/studio/build/application-id.html)
        
        applicationId "org.fuks.app"
        minSdkVersion 23 // Updated to match firebase_auth requirement
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['uploadKeyAlias']
            keyPassword keystoreProperties['uploadKeyPassword']
            storeFile keystoreProperties['uploadStoreFile'] ? rootProject.file(keystoreProperties['uploadStoreFile']) : null
            storePassword keystoreProperties['uploadStorePassword']
        }
    }



    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            }
        }
}


flutter {
    source '../..'
}

